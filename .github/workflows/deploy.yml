name: Deploy to Cloudflare Pages

# Push to main -> deploy the static apex site to the "nixfred-cloud" Cloudflare Pages project.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage public files
        run: |
          mkdir dist
          rsync -a --exclude='.git' --exclude='.github' --exclude='README.md' --exclude='.gitignore' --exclude='dist' ./ dist/
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy dist --project-name=nixfred-cloud --branch=main --commit-dirty=true
