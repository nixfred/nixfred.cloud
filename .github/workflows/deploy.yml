name: Deploy to Cloudflare Pages

# Push to main -> deploy public/ to the "nixfred-cloud" Cloudflare Pages project.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy public --project-name=nixfred-cloud --branch=main --commit-hash=${{ github.sha }} --commit-message="${{ github.event.head_commit.message || 'manual deploy' }}"
