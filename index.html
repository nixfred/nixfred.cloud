<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06080d">
  <title>nixfred.cloud</title>
  <meta name="description" content="nixfred.cloud — a cloud that computes, and snows nix. AI infrastructure hub.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='6'%20fill='%2306080d'/%3E%3Ccircle%20cx='16'%20cy='16'%20r='6.5'%20fill='%23f85149'/%3E%3Ccircle%20cx='16'%20cy='16'%20r='11'%20fill='none'%20stroke='%23f85149'%20stroke-opacity='0.4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css?v=4">
</head>
<body>
  <!-- Layer A: WebGL volumetric storm cloud -->
  <canvas id="cloud" aria-hidden="true"></canvas>
  <!-- Layers B/C: 2D canvas — snow, lightning, drift, constellation hub -->
  <canvas id="fx" aria-hidden="true"></canvas>

  <!-- Custom cursor: your hand in the storm -->
  <div id="cursor" aria-hidden="true"><span class="ring"></span><span class="dot"></span></div>

  <!-- Storm sound toggle -->
  <button id="snd" type="button" aria-label="toggle storm sound" aria-pressed="true" title="storm sound">&#9834;</button>

  <!-- Layer D: cold-boot cold-open -->
  <div id="boot" aria-hidden="true"><pre id="bootlog"></pre></div>

  <!-- Foreground content -->
  <main id="stage">
    <header id="hero">
      <h1 id="wordmark">
        <span class="w">nixfred</span><span class="dot">.</span><span class="w">cloud</span>
      </h1>
      <p id="tag">a cloud that computes &mdash; and snows nix</p>
    </header>
    <footer id="hud">
      <span class="hint" id="termhint">move &mdash; wind &nbsp;·&nbsp; hold+click &mdash; lightning &nbsp;·&nbsp; <kbd>`</kbd> console</span>
      <span class="served">served from <code>red</code> over a Cloudflare tunnel</span>
    </footer>
  </main>

  <!-- *nix console — backtick toggles it; commands drive the storm -->
  <div id="term" aria-hidden="true">
    <div id="termout"></div>
    <div id="termline">
      <span id="termprompt">fred@red:~$</span>
      <input id="terminput" type="text" autocomplete="off" autocapitalize="off"
             autocorrect="off" spellcheck="false" aria-label="console input">
    </div>
  </div>

  <noscript>
    <div class="noscript">
      <h1>nixfred.cloud</h1>
      <p>A cloud that computes, and snows nix. The storm needs JavaScript &mdash;
      but the box behind it does not.</p>
    </div>
  </noscript>

  <script src="/storm.js?v=6" defer></script>
</body>
</html>
